[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-local-leads"
version = "0.1.0"
description = "Python client for Local Lead Finder on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "local", "leads"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/apify-actor-local-leads"
Source = "https://github.com/apivault-labs/local-leads-python"
Documentation = "https://github.com/apivault-labs/local-leads-python#readme"

[tool.setuptools.packages.find]
include = ["apivault_local_leads*"]
